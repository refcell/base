[package]
name = "base-alloy-consensus"
description = "OP Stack consensus types for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["rlp"] }
alloy-rlp.workspace = true
derive_more = { workspace = true, features = ["display"] }
thiserror.workspace = true

# alloy-compat
alloy-network = { workspace = true, optional = true }
alloy-rpc-types-eth = { workspace = true, optional = true }

# serde
alloy-serde = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, optional = true }

# arbitrary
arbitrary = { workspace = true, features = ["derive"], optional = true }

# reth (optional, for trait compatibility)
reth-primitives-traits = { workspace = true, optional = true }
reth-codecs = { workspace = true, optional = true }
reth-zstd-compressors = { workspace = true, optional = true }
reth-db-api = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# evm-compat
alloy-evm = { workspace = true, optional = true }
op-revm = { workspace = true, optional = true }
revm = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
rand.workspace = true
bincode.workspace = true

[features]
default = ["std"]
std = [
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "serde?/std",
    "thiserror/std",
]
serde = [
    "dep:alloy-serde",
    "dep:serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
]
serde-bincode-compat = ["serde", "serde_with", "alloy-consensus/serde-bincode-compat", "reth-primitives-traits?/serde-bincode-compat"]
k256 = ["alloy-consensus/k256", "alloy-primitives/k256"]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-primitives/rand",
]
alloy-compat = ["serde", "dep:alloy-network", "dep:alloy-rpc-types-eth"]
reth-compat = ["dep:reth-primitives-traits", "dep:reth-codecs", "dep:reth-zstd-compressors", "dep:reth-db-api", "dep:bytes", "k256", "serde-bincode-compat"]
evm-compat = ["dep:alloy-evm", "dep:op-revm", "dep:revm"]
