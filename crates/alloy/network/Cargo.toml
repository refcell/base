[package]
name = "base-alloy-network"
description = "OP Stack blockchain RPC behavior abstraction for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace
base-alloy-consensus = { path = "../consensus", features = ["alloy-compat"] }
base-alloy-rpc-types = { path = "../rpc-types" }

# Alloy
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-signer.workspace = true

[features]
std = ["base-alloy-consensus/std", "base-alloy-rpc-types/std"]
serde = ["base-alloy-consensus/serde", "base-alloy-rpc-types/serde"]
