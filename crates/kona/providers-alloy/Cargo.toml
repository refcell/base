[package]
name = "base-providers-alloy"
version = "0.3.3"
description = "Alloy Backed Providers"

edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Base/Kona
base-macros.workspace = true
base-genesis.workspace = true
base-protocol.workspace = true
base-derive.workspace = true

# Alloy
alloy-serde.workspace = true
alloy-eips = { workspace = true, features = ["kzg"] }
alloy-transport.workspace = true
alloy-transport-http = { workspace = true, features = ["reqwest", "reqwest-rustls-tls", "hyper", "hyper-tls", "jwt-auth"] }
alloy-consensus.workspace = true
alloy-rpc-types-beacon.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-rpc-client.workspace = true
alloy-provider = { workspace = true, features = ["ipc", "ws", "reqwest"] }
alloy-primitives = { workspace = true, features = ["map"] }

# Base Alloy
base-alloy-consensus.workspace = true
base-alloy-network.workspace = true

# Misc
lru.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
tower.workspace = true
http-body-util.workspace = true

c-kzg.workspace = true

# `metrics` feature
metrics = { workspace = true, optional = true }

[features]
default = []
metrics = [ "dep:metrics", "base-derive/metrics" ]

[dev-dependencies]
tokio.workspace = true
httpmock.workspace = true
serde_json.workspace = true
