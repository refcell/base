[package]
name = "base-gossip"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Gossip protocol implementation for the OP Stack"

[lints]
workspace = true

[dependencies]
# Base
base-peers.workspace = true
base-macros.workspace = true
base-genesis.workspace = true
base-disc.workspace = true

# Alloy
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-primitives = { workspace = true, features = ["k256", "getrandom"] }

# Base Alloy (ported from op-alloy)
base-alloy-consensus = { workspace = true, features = ["k256"] }
base-alloy-rpc-types-engine = { workspace = true, features = ["std", "serde"] }

# Networking
snap.workspace = true
futures.workspace = true
libp2p-stream.workspace = true
discv5 = { workspace = true, features = ["libp2p"] }
openssl = { version = "0.10", features = ["vendored"] }
libp2p-identity = { workspace = true, features = ["secp256k1"] }
libp2p = { workspace = true, features = ["macros", "tokio", "tcp", "dns", "noise", "gossipsub", "ping", "yamux", "identify"] }
ipnet = { version = "2.11", features = ["serde"] }

# Misc
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_repr = "0.1"
lazy_static.workspace = true
derive_more = { workspace = true, features = ["display", "deref", "debug", "from"] }

# `metrics` feature
metrics = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
multihash = "0.19"
serde_json.workspace = true
alloy-eips.workspace = true
alloy-chains.workspace = true

rand = { workspace = true, features = ["thread_rng"] }
arbitrary = { workspace = true, features = ["derive"] }
alloy-primitives = { workspace = true, features = ["arbitrary"] }
alloy-rpc-types-engine = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["arbitrary", "k256"] }
base-alloy-consensus = { workspace = true, features = ["arbitrary", "k256"] }

[features]
default = []
metrics = [ "dep:metrics", "base-disc/metrics", "libp2p/metrics" ]
