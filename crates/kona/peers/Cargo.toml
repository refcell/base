[package]
name = "base-peers"
version = "0.1.0"
description = "Network peers library for the OP Stack"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Base
base-registry.workspace = true

# Alloy
alloy-rlp.workspace = true
alloy-primitives = { workspace = true, features = ["k256", "getrandom"] }

# Networking
discv5 = { workspace = true, features = ["libp2p"] }
libp2p-identity = { workspace = true, features = ["secp256k1"] }
libp2p = { workspace = true, features = ["macros", "tokio", "tcp", "noise", "gossipsub", "ping", "yamux", "identify"] }

# Cryptography
secp256k1.workspace = true

# Misc
url.workspace = true
dirs = "6.0"
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
lazy_static.workspace = true
unsigned-varint = "0.8"
serde_json = { workspace = true, features = ["std"] }
derive_more = { workspace = true, features = ["display", "deref", "debug", "from", "from_str"] }

# `arbitrary` feature dependencies
arbitrary = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
arbtest.workspace = true
tempfile.workspace = true
multihash = "0.19"
serde_json.workspace = true

base-genesis.workspace = true

arbitrary = { workspace = true, features = ["derive"] }
alloy-primitives = { workspace = true, features = ["arbitrary"] }
alloy-consensus = { workspace = true, features = ["arbitrary", "k256"] }

[features]
default = []
arbitrary = ["alloy-primitives/arbitrary", "dep:arbitrary"]
