[package]
name = "base-engine"
description = "An implementation of the OP Stack engine client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints.rust]
missing-debug-implementations = "warn"
unreachable-pub = "warn"
rust-2018-idioms = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_const_for_fn = "allow"
clone_on_ref_ptr = "allow"
match_same_arms = "allow"
redundant_else = "allow"
use_self = "allow"

[dependencies]
# workspace
base-genesis.workspace = true
base-macros.workspace = true
base-protocol = { workspace = true, features = ["serde", "std"] }

# alloy
alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-json-rpc.workspace = true
alloy-network.workspace = true
alloy-transport.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["ipc", "reqwest", "reqwest-rustls-tls", "engine-api"] }
alloy-rpc-client.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["jwt", "serde"] }
alloy-transport-http = { workspace = true, features = ["reqwest", "hyper", "jwt-auth"] }

# base-alloy
base-alloy-network.workspace = true
base-alloy-consensus.workspace = true
base-alloy-provider.workspace = true
base-alloy-rpc-types.workspace = true
base-alloy-rpc-types-engine.workspace = true

# rollup-boost uses op-alloy types internally, conversion via serde JSON
op-alloy-rpc-types-engine = { workspace = true, features = ["serde"] }

# general
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
thiserror.workspace = true
url.workspace = true
tower.workspace = true
http-body-util.workspace = true
derive_more = { workspace = true, features = ["display", "deref", "from_str", "constructor"] }
serde_json.workspace = true
jsonrpsee-types.workspace = true

# metrics
metrics = { workspace = true, optional = true }

# rollup boost
rollup-boost.workspace = true
rollup-boost-types = "0.1.0"
http.workspace = true
parking_lot.workspace = true

[dev-dependencies]
base-registry.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
arbitrary.workspace = true
base-alloy-rpc-types = { workspace = true, features = ["arbitrary", "k256"] }
metrics-exporter-prometheus.workspace = true
rstest.workspace = true

[features]
metrics = ["dep:metrics"]
test-utils = []
