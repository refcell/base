[package]
name = "base-cli"
version = "0.0.0"
description = "Shared CLI utilities for Base crates"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace
base-genesis.workspace = true
base-registry.workspace = true

# Alloy
alloy-chains.workspace = true

# General
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive", "env"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json", "tracing-log"] }
tracing-appender.workspace = true
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
metrics-process = { workspace = true, features = ["metrics-rs"] }
thiserror.workspace = true

# `secrets` feature
libp2p = { workspace = true, features = ["secp256k1"], optional = true }
alloy-primitives.workspace = true

[dev-dependencies]
rstest.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
secrets = ["dep:libp2p"]
