[package]
name = "base-payload-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A payload builder for op-reth that builds optimistic payloads."

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-primitives-traits.workspace = true
reth-revm = { workspace = true, features = ["witness"] }
reth-transaction-pool.workspace = true
reth-storage-api.workspace = true
reth-evm.workspace = true
reth-execution-types.workspace = true
reth-payload-builder.workspace = true
reth-payload-builder-primitives.workspace = true
reth-payload-util.workspace = true
reth-payload-primitives = { workspace = true, features = ["op"] }
reth-basic-payload-builder.workspace = true
reth-payload-validator.workspace = true

# op-reth
base-evm = { path = "../evm" }
base-forks = { path = "../hardforks" }
base-reth-primitives = { path = "../primitives" }
base-txpool-reth = { path = "../txpool" }

# ethereum
revm.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
base-alloy-rpc-types-engine = { path = "../../alloy/rpc-types-engine", features = ["serde", "reth-compat"] }
base-alloy-consensus = { path = "../../alloy/consensus" }
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-consensus.workspace = true
alloy-evm.workspace = true

# misc
derive_more.workspace = true
tracing.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde.workspace = true
either.workspace = true
