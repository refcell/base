[package]
name = "base-execution-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# reth
reth-execution-types.workspace = true
reth-chainspec.workspace = true
reth-consensus-common.workspace = true
reth-consensus.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true
reth-storage-errors.workspace = true
reth-trie-common.workspace = true

# op-reth
base-forks = { path = "../hardforks" }
base-reth-primitives = { path = "../primitives" }

# ethereum
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-trie.workspace = true
revm.workspace = true

# misc
tracing.workspace = true
thiserror.workspace = true
base-chainspec = { path = "../chainspec" }

[dev-dependencies]
reth-provider = { workspace = true, features = ["test-utils"] }
reth-db-common.workspace = true
reth-revm.workspace = true
reth-trie.workspace = true
base-node = { path = "../node" }

alloy-chains.workspace = true

base-alloy-consensus = { path = "../../alloy/consensus" }

[features]
default = ["std"]
std = [
    "reth-chainspec/std",
    "reth-consensus/std",
    "reth-consensus-common/std",
    "reth-primitives-traits/std",
    "base-forks/std",
    "base-chainspec/std",
    "base-reth-primitives/std",
    "reth-storage-api/std",
    "reth-storage-errors/std",
    "reth-trie-common/std",
    "alloy-chains/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-consensus/std",
    "alloy-trie/std",
    "reth-revm/std",
    "revm/std",
    "tracing/std",
    "thiserror/std",
    "reth-execution-types/std",
    "base-alloy-consensus/std",
]
