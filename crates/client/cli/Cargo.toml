[package]
name = "base-client-cli"
description = "CLI argument types for Base node consensus clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Shared
base-jwt = { workspace = true, features = ["engine-validation"] }

# Base (ported from kona)
base-rpc.workspace = true
base-node-service.workspace = true
base-genesis.workspace = true
base-derive.workspace = true
base-disc.workspace = true
base-gossip.workspace = true
base-peers.workspace = true
base-sources.workspace = true
base-providers-alloy.workspace = true
base-cli = { workspace = true, features = ["secrets"] }
base-registry.workspace = true

# Serde
serde_json.workspace = true

# Alloy
alloy-chains.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true

# Networking
libp2p = { workspace = true, features = ["secp256k1", "macros", "tokio", "tcp", "noise", "gossipsub", "ping", "yamux", "identify"] }
discv5 = { workspace = true, features = ["libp2p"] }
reqwest.workspace = true

# CLI
url.workspace = true
clap.workspace = true
thiserror.workspace = true
eyre.workspace = true
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
rstest.workspace = true
